<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GURU</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { height: 100%; overflow: hidden; background: #0e1621; color: #fff; }

  #auth-screen {
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
    background: radial-gradient(circle at 30% 20%, #17212b, #0e1621);
  }
  .auth-box {
    background: #17212b; padding: 40px; border-radius: 12px;
    width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .auth-logo {
    font-size: 34px; font-weight: 800; letter-spacing: 4px;
    background: linear-gradient(135deg, #5288c1, #7bc862);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .auth-box h2 { font-size: 16px; color: #7f91a4; font-weight: 400; margin-bottom: 24px; }
  .auth-box input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px;
    background: #242f3d; border: 1px solid #2b3a4d; border-radius: 8px;
    color: #fff; font-size: 15px; outline: none;
  }
  .auth-box input:focus { border-color: #5288c1; }
  .input-prefix { position: relative; }
  .input-prefix span {
    position: absolute; left: 14px; top: 22px; transform: translateY(-50%);
    color: #6b7c8e; font-size: 15px; pointer-events: none;
  }
  .input-prefix input { padding-left: 28px; }
  .auth-box button {
    width: 100%; padding: 13px; background: #5288c1; color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .auth-box button:hover { background: #4679ae; }
  .auth-box button:disabled { opacity: .6; cursor: wait; }
  .auth-switch { text-align: center; margin-top: 16px; font-size: 14px; color: #7f91a4; }
  .auth-switch a { color: #5288c1; cursor: pointer; text-decoration: none; }
  .auth-error { color: #ef5350; font-size: 13px; margin-bottom: 10px; min-height: 16px; line-height: 1.3; }

  #app { display: none; height: 100vh; }

  #sidebar {
    width: 380px; height: 100vh; background: #17212b;
    border-right: 1px solid #0e1621;
    display: flex; flex-direction: column;
  }
  #sidebar-header {
    padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #0e1621;
  }
  #sidebar-header .logo {
    font-size: 20px; font-weight: 800; letter-spacing: 2px; flex: 1;
    background: linear-gradient(135deg, #5288c1, #7bc862);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #me-info {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 6px 10px; border-radius: 8px; transition: background .15s;
  }
  #me-info:hover { background: #242f3d; }
  #me-info .me-name { font-size: 13px; color: #7f91a4; }

  #search-input {
    margin: 10px 12px; padding: 10px 14px;
    background: #242f3d; border: none; border-radius: 20px;
    color: #fff; font-size: 14px; outline: none;
  }
  #search-input::placeholder { color: #6b7c8e; }

  #chat-list, #search-results { flex: 1; overflow-y: auto; }
  #chat-list::-webkit-scrollbar, #search-results::-webkit-scrollbar, #messages::-webkit-scrollbar { width: 6px; }
  #chat-list::-webkit-scrollbar-thumb, #search-results::-webkit-scrollbar-thumb, #messages::-webkit-scrollbar-thumb { background: #2b3a4d; border-radius: 3px; }

  .chat-item {
    display: flex; padding: 12px 16px; cursor: pointer;
    align-items: center; gap: 12px; transition: background .1s;
  }
  .chat-item:hover { background: #202b36; }
  .chat-item.active { background: #2b5278; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; color: #fff; font-size: 18px; flex-shrink: 0;
    position: relative;
  }
  .avatar-wrap { position: relative; display: inline-block; }
  .online-dot {
    position: absolute; bottom: 0; right: 0;
    width: 13px; height: 13px; border-radius: 50%;
    background: #4dcd5e; border: 2px solid #17212b;
    display: none;
  }
  .online-dot.on { display: block; }

  .chat-item-info { flex: 1; min-width: 0; }
  .chat-item-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
  .chat-item-last {
    font-size: 13px; color: #7f91a4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .empty-list { padding: 30px 20px; text-align: center; color: #6b7c8e; font-size: 14px; }

  #chat-area {
    flex: 1; display: flex; flex-direction: column;
    background: #0e1621;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
    background-size: 20px 20px;
    position: relative;
  }
  #empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #6b7c8e;
  }
  #empty-state .big { font-size: 60px; margin-bottom: 16px; opacity: .3; }

  #chat-view { display: none; flex: 1; flex-direction: column; height: 100vh; }

  #chat-header {
    padding: 10px 20px; background: #17212b;
    border-bottom: 1px solid #0e1621;
    display: flex; align-items: center; gap: 12px;
  }
  #back-btn {
    display: none;
    background: none; border: none; color: #5288c1;
    font-size: 26px; cursor: pointer; padding: 0 6px;
    line-height: 1; flex-shrink: 0;
  }
  #back-btn:hover { color: #7ba7d6; }
  #chat-header .name { font-size: 16px; font-weight: 600; }
  #chat-header .status { font-size: 13px; color: #7f91a4; transition: color .2s; }
  #chat-header .status.typing { color: #5288c1; }
  #chat-header .status.online { color: #4dcd5e; }

  #messages {
    flex: 1; overflow-y: auto; padding: 20px 5%;
    display: flex; flex-direction: column; gap: 4px;
  }
  .msg {
    max-width: 60%; padding: 8px 12px 6px;
    border-radius: 12px; font-size: 15px; line-height: 1.35;
    word-wrap: break-word; position: relative;
    animation: pop .15s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.own {
    align-self: flex-end; background: #2b5278;
    border-bottom-right-radius: 4px;
  }
  .msg.other {
    align-self: flex-start; background: #182533;
    border-bottom-left-radius: 4px;
  }
  .msg .time {
    font-size: 11px; color: rgba(255,255,255,.5);
    float: right; margin: 6px 0 0 8px;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .check {
    display: inline-block;
    font-size: 12px; letter-spacing: -3px;
    color: rgba(255,255,255,.55);
    transition: color .2s;
  }
  .check.read { color: #4dcd5e; }

  #input-area {
    padding: 12px 20px; background: #17212b;
    border-top: 1px solid #0e1621;
    display: flex; align-items: flex-end; gap: 10px;
  }
  #message-input {
    flex: 1; padding: 12px 16px; background: #242f3d;
    border: none; border-radius: 12px; color: #fff;
    font-size: 15px; outline: none; resize: none;
    max-height: 150px; font-family: inherit;
    line-height: 1.4;
  }
  #send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: #5288c1; border: none; color: #fff;
    font-size: 20px; cursor: pointer; flex-shrink: 0;
    transition: background .15s;
  }
  #send-btn:hover { background: #4679ae; }

  @media (max-width: 768px) {
    #sidebar { width: 100%; position: absolute; z-index: 10; }
    #sidebar.hidden { display: none; }
    #chat-area { width: 100%; }
    .msg { max-width: 80%; }
    #back-btn { display: block; }
  }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">GURU</div>
    <h2 id="auth-subtitle">Войди, чтобы начать общаться</h2>
    <div class="auth-error" id="auth-error"></div>
    <div class="input-prefix">
      <span>@</span>
      <input id="auth-nick" type="text" placeholder="ник" autocomplete="username" maxlength="20">
    </div>
    <input id="auth-pass" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
    <button id="auth-btn">Войти</button>
    <div class="auth-switch">
      <span id="auth-switch-text">Нет аккаунта?</span>
      <a id="auth-switch-link">Зарегистрироваться</a>
    </div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <div class="logo">GURU</div>
      <div id="me-info" title="Выйти">
        <div class="avatar" id="me-avatar" style="width:32px;height:32px;font-size:13px"></div>
        <span class="me-name" id="me-name"></span>
      </div>
    </div>
    <input id="search-input" type="text" placeholder="Поиск людей по нику...">
    <div id="chat-list"></div>
    <div id="search-results" style="display:none"></div>
  </aside>

  <main id="chat-area">
    <div id="empty-state">
      <div class="big">💬</div>
      <div>Выбери чат или найди друга через поиск</div>
    </div>
    <div id="chat-view">
      <div id="chat-header"></div>
      <div id="messages"></div>
      <div id="input-area">
        <textarea id="message-input" rows="1" placeholder="Написать сообщение..."></textarea>
        <button id="send-btn">➤</button>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, getDocs,
  query, where, orderBy, onSnapshot, addDoc, serverTimestamp,
  limit, updateDoc, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAU1d1L946PF9lrLKoaE6TQ5fzUE1CR1ws",
  authDomain: "guru-3ac62.firebaseapp.com",
  projectId: "guru-3ac62",
  storageBucket: "guru-3ac62.firebasestorage.app",
  messagingSenderId: "804193290850",
  appId: "1:804193290850:web:42f8411c72fee2cf139f3b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const DOMAIN = "@guru.app";

let currentUser = null;
let currentNick = null;
let currentChatId = null;
let currentChatUser = null;
let currentChatData = null;
let lastMsgs = [];
let unsubMessages = null;
let unsubChats = null;
let unsubChatDoc = null;
let unsubOtherUser = null;
let usersCache = {};
let lastTypingSent = 0;
let heartbeatTimer = null;

const $ = id => document.getElementById(id);

const authScreen = $("auth-screen");
const appScreen = $("app");
const authBtn = $("auth-btn");
const authNick = $("auth-nick");
const authPass = $("auth-pass");
const authError = $("auth-error");
const authSubtitle = $("auth-subtitle");
const authSwitchText = $("auth-switch-text");
const authSwitchLink = $("auth-switch-link");

let isRegister = false;

authSwitchLink.onclick = () => {
  isRegister = !isRegister;
  authBtn.textContent = isRegister ? "Создать аккаунт" : "Войти";
  authSubtitle.textContent = isRegister ? "Придумай ник и пароль" : "Войди, чтобы начать общаться";
  authSwitchText.textContent = isRegister ? "Уже есть аккаунт?" : "Нет аккаунта?";
  authSwitchLink.textContent = isRegister ? "Войти" : "Зарегистрироваться";
  authError.textContent = "";
};

const NICK_RE = /^[a-zA-Z0-9_]{3,20}$/;

function translateError(code) {
  const map = {
    "auth/invalid-email": "Ник: только латиница, цифры и _",
    "auth/user-not-found": "Такого ника нет",
    "auth/wrong-password": "Неверный пароль",
    "auth/invalid-credential": "Неверный ник или пароль",
    "auth/email-already-in-use": "Этот ник уже занят 😔",
    "auth/weak-password": "Пароль слишком слабый",
    "auth/operation-not-allowed": "Включи Email/Password в Firebase",
    "auth/network-request-failed": "Нет интернета или Firebase недоступен",
    "auth/too-many-requests": "Слишком много попыток, подожди минуту",
    "permission-denied": "Firestore Rules не настроены",
  };
  return map[code] || ("Ошибка: " + code);
}

authBtn.onclick = async () => {
  authError.textContent = "";
  const nick = authNick.value.trim();
  const pass = authPass.value;

  if (!nick || !pass) { authError.textContent = "Заполни ник и пароль"; return; }
  if (!NICK_RE.test(nick)) { authError.textContent = "Ник: 3-20 символов, латиница/цифры/_"; return; }
  if (pass.length < 6) { authError.textContent = "Пароль минимум 6 символов"; return; }

  const email = nick.toLowerCase() + DOMAIN;
  authBtn.disabled = true;
  const oldText = authBtn.textContent;
  authBtn.textContent = "Подожди...";

  try {
    if (isRegister) {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: nick });
      await setDoc(doc(db, "users", cred.user.uid), {
        uid: cred.user.uid,
        nick: nick,
        nickLower: nick.toLowerCase(),
        lastSeen: Timestamp.now(),
        createdAt: serverTimestamp()
      });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) {
    console.error("Auth error:", e.code, e.message);
    authError.textContent = translateError(e.code);
    authBtn.disabled = false;
    authBtn.textContent = oldText;
  }
};

[authNick, authPass].forEach(inp => {
  inp.addEventListener("keydown", e => { if (e.key === "Enter") authBtn.click(); });
});

// ============ HEARTBEAT (онлайн) ============
async function updateLastSeen() {
  if (!currentUser) return;
  try {
    await setDoc(doc(db, "users", currentUser.uid), {
      lastSeen: Timestamp.now()
    }, { merge: true });
  } catch (e) {}
}

function startHeartbeat() {
  stopHeartbeat();
  updateLastSeen();
  heartbeatTimer = setInterval(() => {
    if (!document.hidden) updateLastSeen();
  }, 30000);
}

function stopHeartbeat() {
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && currentUser) updateLastSeen();
});
window.addEventListener("beforeunload", () => {
  if (currentUser) updateLastSeen();
});

// ============ АВТОРИЗАЦИЯ ============
onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user;
    try {
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);
      let data;
      if (!snap.exists()) {
        const nick = user.displayName || ("user" + user.uid.slice(0, 5));
        data = { uid: user.uid, nick, nickLower: nick.toLowerCase(), lastSeen: Timestamp.now(), createdAt: serverTimestamp() };
        await setDoc(userRef, data);
      } else {
        data = snap.data();
      }
      currentNick = data.nick;
      usersCache[user.uid] = data;

      $("me-avatar").textContent = initials(currentNick);
      $("me-avatar").style.background = colorFromId(user.uid);
      $("me-name").textContent = "@" + currentNick;

      authScreen.style.display = "none";
      appScreen.style.display = "flex";
      authBtn.disabled = false;
      authBtn.textContent = isRegister ? "Создать аккаунт" : "Войти";

      startHeartbeat();
      loadChats();
    } catch (e) {
      console.error("Init error:", e);
      authError.textContent = translateError(e.code || "unknown");
      await signOut(auth);
    }
  } else {
    currentUser = null;
    currentNick = null;
    currentChatId = null;
    currentChatUser = null;
    currentChatData = null;
    lastMsgs = [];
    stopHeartbeat();
    if (unsubChats) { unsubChats(); unsubChats = null; }
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    if (unsubChatDoc) { unsubChatDoc(); unsubChatDoc = null; }
    if (unsubOtherUser) { unsubOtherUser(); unsubOtherUser = null; }
    authScreen.style.display = "flex";
    appScreen.style.display = "none";
    $("chat-list").innerHTML = "";
    $("chat-view").style.display = "none";
    $("empty-state").style.display = "flex";
  }
});

$("me-info").onclick = () => {
  if (confirm("Выйти из GURU?")) {
    updateLastSeen().finally(() => signOut(auth));
  }
};

// ============ УТИЛИТЫ ============
function initials(name) {
  if (!name) return "?";
  return name.trim().slice(0, 2).toUpperCase();
}
function colorFromId(id) {
  const colors = ["#e17076","#7bc862","#e5ca77","#65aadd","#a695e7","#ee7aae","#6ec9cb","#faa774"];
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
  return colors[Math.abs(hash) % colors.length];
}
function formatTime(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " +
         d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}
function formatLastSeen(ts) {
  if (!ts) return "недавно";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return "был(а) только что";
  if (diff < 3600) return `был(а) ${Math.floor(diff / 60)} мин назад`;
  if (diff < 86400) return `был(а) ${Math.floor(diff / 3600)} ч назад`;
  const days = Math.floor(diff / 86400);
  if (days === 1) return "был(а) вчера";
  return `был(а) ${days} дн. назад`;
}
function chatIdFor(uid1, uid2) {
  return [uid1, uid2].sort().join("_");
}
async function getUserData(uid) {
  if (usersCache[uid]) return usersCache[uid];
  try {
    const snap = await getDoc(doc(db, "users", uid));
    if (snap.exists()) {
      usersCache[uid] = snap.data();
      return usersCache[uid];
    }
  } catch (e) { console.error(e); }
  return { uid, nick: "unknown" };
}
function escapeHtml(s) {
  if (!s) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function isOnline(userData) {
  if (!userData?.lastSeen) return false;
  const ts = userData.lastSeen.toMillis ? userData.lastSeen.toMillis() : new Date(userData.lastSeen).getTime();
  return (Date.now() - ts) < 60000;
}

// ============ СПИСОК ЧАТОВ ============
function loadChats() {
  if (unsubChats) unsubChats();
  const q = query(collection(db, "chats"), where("members", "array-contains", currentUser.uid));
  unsubChats = onSnapshot(q, async snap => {
    const chats = [];
    for (const d of snap.docs) {
      const data = d.data();
      const otherUid = data.members.find(u => u !== currentUser.uid);
      const other = await getUserData(otherUid);
      chats.push({ id: d.id, ...data, other });
    }
    chats.sort((a, b) => {
      const at = a.lastMessageAt?.toMillis?.() || 0;
      const bt = b.lastMessageAt?.toMillis?.() || 0;
      return bt - at;
    });
    renderChatList(chats);
  }, err => console.error("Chats error:", err));
}

function renderChatList(chats) {
  const list = $("chat-list");
  if (chats.length === 0) {
    list.innerHTML = `<div class="empty-list">Пока нет чатов.<br>Найди друга через поиск выше 👆</div>`;
    return;
  }
  list.innerHTML = chats.map(c => {
    const online = isOnline(c.other);
    return `
      <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" data-id="${c.id}" data-uid="${c.other.uid}">
        <div class="avatar-wrap">
          <div class="avatar" style="background:${colorFromId(c.other.uid)}">${initials(c.other.nick)}</div>
          <div class="online-dot ${online ? 'on' : ''}"></div>
        </div>
        <div class="chat-item-info">
          <div class="chat-item-name">${escapeHtml(c.other.nick)}</div>
          <div class="chat-item-last">${escapeHtml(c.lastMessage || "Нет сообщений")}</div>
        </div>
      </div>
    `;
  }).join("");
  list.querySelectorAll(".chat-item").forEach(el => {
    el.onclick = () => openChat(el.dataset.id, el.dataset.uid);
  });
}

// ============ ПОИСК ============
const searchInput = $("search-input");
const searchResults = $("search-results");
const chatListEl = $("chat-list");

searchInput.addEventListener("input", async () => {
  const q = searchInput.value.trim().toLowerCase().replace(/^@/, "");
  if (!q) {
    searchResults.style.display = "none";
    chatListEl.style.display = "block";
    return;
  }
  chatListEl.style.display = "none";
  searchResults.style.display = "block";
  searchResults.innerHTML = `<div class="empty-list">Поиск...</div>`;

  try {
    const snap = await getDocs(query(collection(db, "users"), limit(200)));
    const found = [];
    snap.forEach(d => {
      const u = d.data();
      if (u.uid === currentUser.uid) return;
      const nl = (u.nickLower || u.nick || "").toLowerCase();
      if (nl.includes(q)) {
        usersCache[u.uid] = u;
        found.push(u);
      }
    });

    if (found.length === 0) {
      searchResults.innerHTML = `<div class="empty-list">Никого не найдено</div>`;
      return;
    }
    searchResults.innerHTML = found.map(u => {
      const online = isOnline(u);
      return `
        <div class="chat-item" data-uid="${u.uid}">
          <div class="avatar-wrap">
            <div class="avatar" style="background:${colorFromId(u.uid)}">${initials(u.nick)}</div>
            <div class="online-dot ${online ? 'on' : ''}"></div>
          </div>
          <div class="chat-item-info">
            <div class="chat-item-name">${escapeHtml(u.nick)}</div>
            <div class="chat-item-last">@${escapeHtml(u.nick)}</div>
          </div>
        </div>
      `;
    }).join("");
    searchResults.querySelectorAll(".chat-item").forEach(el => {
      el.onclick = async () => {
        const uid = el.dataset.uid;
        const cid = chatIdFor(currentUser.uid, uid);
        const chatRef = doc(db, "chats", cid);
        try {
          const existing = await getDoc(chatRef);
          if (!existing.exists()) {
            await setDoc(chatRef, {
              members: [currentUser.uid, uid],
              lastMessage: "",
              lastMessageAt: serverTimestamp(),
              createdAt: serverTimestamp()
            });
          }
        } catch (e) { console.error(e); }
        searchInput.value = "";
        searchResults.style.display = "none";
        chatListEl.style.display = "block";
        openChat(cid, uid);
      };
    });
  } catch (e) {
    console.error(e);
    searchResults.innerHTML = `<div class="empty-list">Ошибка поиска</div>`;
  }
});

// ============ ОТКРЫТИЕ ЧАТА ============
async function openChat(chatId, otherUid) {
  currentChatId = chatId;
  currentChatUser = await getUserData(otherUid);
  currentChatData = null;
  lastMsgs = [];

  $("empty-state").style.display = "none";
  $("chat-view").style.display = "flex";
  $("messages").innerHTML = "";

  renderChatHeader();

  // Скрываем сайдбар на мобиле
  if (window.innerWidth <= 768) {
    $("sidebar").classList.add("hidden");
  }

  // Подписка на документ чата (для typing и lastRead)
  if (unsubChatDoc) unsubChatDoc();
  unsubChatDoc = onSnapshot(doc(db, "chats", chatId), snap => {
    currentChatData = snap.data() || {};
    updateCheckmarks();
    updateChatStatus();
  }, err => console.error("Chat doc error:", err));

  // Подписка на собеседника (для онлайна)
  if (unsubOtherUser) unsubOtherUser();
  unsubOtherUser = onSnapshot(doc(db, "users", otherUid), snap => {
    if (snap.exists()) {
      usersCache[otherUid] = snap.data();
      currentChatUser = usersCache[otherUid];
      updateChatStatus();
    }
  }, err => console.error("User doc error:", err));

  // Подписка на сообщения
  if (unsubMessages) unsubMessages();
  const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"), limit(500));
  unsubMessages = onSnapshot(q, snap => {
    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMessages(msgs);
  }, err => console.error("Messages error:", err));

  $("message-input").focus();
}

function renderChatHeader() {
  const online = isOnline(currentChatUser);
  $("chat-header").innerHTML = `
    <button id="back-btn" title="Назад">←</button>
    <div class="avatar-wrap">
      <div class="avatar" style="background:${colorFromId(currentChatUser.uid)};width:42px;height:42px;font-size:16px">${initials(currentChatUser.nick)}</div>
      <div class="online-dot ${online ? 'on' : ''}" id="header-dot"></div>
    </div>
    <div style="flex:1;min-width:0">
      <div class="name">${escapeHtml(currentChatUser.nick)}</div>
      <div class="status" id="chat-status">${online ? 'онлайн' : formatLastSeen(currentChatUser.lastSeen)}</div>
    </div>
  `;
  $("back-btn").onclick = closeChat;
}

function closeChat() {
  if (unsubMessages) { unsubMessages(); unsubMessages = null; }
  if (unsubChatDoc) { unsubChatDoc(); unsubChatDoc = null; }
  if (unsubOtherUser) { unsubOtherUser(); unsubOtherUser = null; }
  currentChatId = null;
  currentChatUser = null;
  currentChatData = null;
  lastMsgs = [];
  $("chat-view").style.display = "none";
  $("empty-state").style.display = "flex";
  $("sidebar").classList.remove("hidden");
}

// Закрытие чата по Escape
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && currentChatId && window.innerWidth > 768) closeChat();
});

function updateChatStatus() {
  const status = $("chat-status");
  if (!status || !currentChatData || !currentChatUser) return;

  // Проверка: печатает ли собеседник
  const typingTs = currentChatData.typing?.[currentChatUser.uid];
  if (typingTs) {
    const ts = typingTs.toMillis ? typingTs.toMillis() : new Date(typingTs).getTime();
    if (Date.now() - ts < 3500) {
      status.textContent = "печатает...";
      status.className = "status typing";
      return;
    }
  }

  // Онлайн / был недавно
  const online = isOnline(currentChatUser);
  if (online) {
    status.textContent = "онлайн";
    status.className = "status online";
  } else {
    status.textContent = formatLastSeen(currentChatUser.lastSeen);
    status.className = "status";
  }

  // Точка на аватаре в шапке
  const dot = $("header-dot");
  if (dot) dot.classList.toggle("on", online);
}

function renderMessages(msgs) {
  lastMsgs = msgs;
  const box = $("messages");
  const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 150;

  box.innerHTML = msgs.map(m => {
    const own = m.senderId === currentUser.uid;
    const ts = m.createdAt?.toMillis?.() || 0;
    let check = "";
    if (own) {
      check = `<span class="check" data-ts="${ts}">✓</span>`;
    }
    return `
      <div class="msg ${own ? 'own' : 'other'}" data-ts="${ts}">
        <div>${escapeHtml(m.text)}</div>
        <span class="time">${formatTime(m.createdAt)}${check ? ' ' + check : ''}</span>
      </div>
    `;
  }).join("");

  if (wasNearBottom || msgs.length <= 1) {
    box.scrollTop = box.scrollHeight;
  }

  updateCheckmarks();
  markChatRead();
}

function updateCheckmarks() {
  if (!currentChatUser || !currentChatData) return;
  const otherUid = currentChatUser.uid;
  const otherRead = currentChatData.lastRead?.[otherUid];
  const readTs = otherRead?.toMillis?.() || 0;

  document.querySelectorAll(".msg.own .check").forEach(el => {
    const msgTs = parseInt(el.dataset.ts || "0");
    if (msgTs > 0 && readTs >= msgTs) {
      el.textContent = "✓✓";
      el.classList.add("read");
    } else {
      el.textContent = "✓";
      el.classList.remove("read");
    }
  });
}

async function markChatRead() {
  if (!currentChatId || !currentUser || !currentChatData || lastMsgs.length === 0) return;
  const lastMsg = lastMsgs[lastMsgs.length - 1];
  const lastTs = lastMsg.createdAt?.toMillis?.() || 0;
  if (lastTs === 0) return;
  const myRead = currentChatData.lastRead?.[currentUser.uid];
  const readTs = myRead?.toMillis?.() || 0;
  if (readTs >= lastTs) return;
  try {
    await updateDoc(doc(db, "chats", currentChatId), {
      [`lastRead.${currentUser.uid}`]: Timestamp.now()
    });
  } catch (e) { /* silent */ }
}

// ============ ОТПРАВКА ============
const msgInput = $("message-input");
const sendBtn = $("send-btn");

msgInput.addEventListener("input", () => {
  msgInput.style.height = "auto";
  msgInput.style.height = Math.min(msgInput.scrollHeight, 150) + "px";
  sendTypingSignal();
});
msgInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});

function sendTypingSignal() {
  if (!currentChatId || !currentUser) return;
  const now = Date.now();
  if (now - lastTypingSent < 1500) return;
  lastTypingSent = now;
  updateDoc(doc(db, "chats", currentChatId), {
    [`typing.${currentUser.uid}`]: Timestamp.now()
  }).catch(() => {});
}

sendBtn.onclick = async () => {
  const text = msgInput.value.trim();
  if (!text || !currentChatId) return;
  msgInput.value = "";
  msgInput.style.height = "auto";

  try {
    await addDoc(collection(db, "chats", currentChatId, "messages"), {
      text,
      senderId: currentUser.uid,
      createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, "chats", currentChatId), {
      lastMessage: text,
      lastMessageAt: serverTimestamp(),
      [`lastRead.${currentUser.uid}`]: Timestamp.now()
    });
  } catch (e) {
    console.error("Send error:", e);
  }
};

// ============ ОБНОВЛЕНИЕ СТАТУСА (раз в 15 сек) ============
setInterval(() => {
  if (currentChatUser && currentChatData) {
    updateChatStatus();
    // Перерисовать список чатов для свежих зелёных точек
    if (!currentChatId) return;
  }
  // Обновить точки в списке чатов
  document.querySelectorAll(".chat-item").forEach(el => {
    const uid = el.dataset.uid;
    if (uid && usersCache[uid]) {
      const online = isOnline(usersCache[uid]);
      const dot = el.querySelector(".online-dot");
      if (dot) dot.classList.toggle("on", online);
    }
  });
}, 15000);
</script>
</body>
